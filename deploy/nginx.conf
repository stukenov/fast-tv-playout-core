server {
  listen 8080;
  server_name _;
  root /var/www;

  types {
    application/vnd.apple.mpegurl m3u8;
    video/mp4 mp4;
    video/iso.segment m4s;
    application/json json;
  }

  location = /healthz { return 200 "ok\n"; }

  # live playlists change every 2 seconds
  location ~ ^/hls/.*\.m3u8$ {
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control "public, max-age=1" always;
    try_files $uri =404;
  }

  # segments and init sections of the live stream never change under the same name
  location ~ ^/hls/.*\.(m4s|mp4)$ {
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }

  # source (VOD) files: the packager downloads them through here; players never need them,
  # so in production this location can be restricted to the internal network
  location /vod/ {
    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }
}
