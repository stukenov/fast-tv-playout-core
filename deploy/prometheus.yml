global:
  scrape_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: control-api
    static_configs: [{ targets: ["control-api:8081"], labels: { service: "control-api" } }]
  - job_name: engine
    static_configs: [{ targets: ["engine:8085"], labels: { service: "engine" } }]
