name: ftvx

x-env: &env
  LOG_LEVEL: ${LOG_LEVEL:-info}
  API_KEY: ${API_KEY:?set API_KEY in .env}
  API_KEYS: ${API_KEYS:-}
  POSTGRES_DSN: postgres://ftvx:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/ftvx?sslmode=disable
  CHANNEL_ID: ${CHANNEL_ID:-c1}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ftvx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ftvx
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ftvx -d ftvx"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Serves the live stream (/hls/). Put a CDN in front of it. The sources are not served: the engine reads them from files.
  # (/vod/ serves MEDIA_DIR for sources that you want to reach over http://; remove it if you do not)
  origin:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - hls:/var/www/hls:ro
      - ${MEDIA_DIR:-./media}:/var/www/vod:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8080:8080"]

  # Channels, assets, schedule and commands for the air. See api/openapi.yaml.
  control-api:
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    build: { context: ., args: { SERVICE: control-api } }
    environment:
      <<: *env
      CUE_LEAD_S: ${CUE_LEAD_S:-3}
    ports: ["127.0.0.1:8081:8081"]

  # Plays the channel: plans the schedule second by second, puts the segments of the sources on one timeline and
  # writes the live playlist into the hls volume. It needs PostgreSQL and the sources.
  engine:
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    build: { context: ., args: { SERVICE: engine } }
    environment:
      <<: *env
      # sources are read from files under /media (file:///media/...) or over http(s)
      SOURCE_FILE_ROOT: /media
      SLATE_URI: ${SLATE_URI:-file:///media/slate/index.m3u8}
      # ads: ADS_URL asks your ad server for every break, otherwise the engine fills breaks from this file
      ADS_URL: ${ADS_URL:-}
      ADS_API_KEY: ${ADS_API_KEY:-}
      ADS_REGISTRY_FILE: ${ADS_REGISTRY_FILE:-/media/ads/_registry.json}
      WEBHOOK_URLS: ${WEBHOOK_URLS:-}
      SCTE35_TAGS: ${SCTE35_TAGS:-daterange}
      # these numbers go into the master playlist and must describe your sources
      VARIANT_ID: ${VARIANT_ID:-v720}
      VARIANT_BANDWIDTH: ${VARIANT_BANDWIDTH:-3000000}
      VARIANT_AVERAGE_BANDWIDTH: ${VARIANT_AVERAGE_BANDWIDTH:-2700000}
      VARIANT_RESOLUTION: ${VARIANT_RESOLUTION:-1280x720}
      VARIANT_FRAME_RATE: ${VARIANT_FRAME_RATE:-25}
      VARIANT_CODECS: ${VARIANT_CODECS:-avc1.640029,mp4a.40.2}
      PLAYLIST_WINDOW_MAX: ${PLAYLIST_WINDOW_MAX:-180}
      LIVE_LEAD_S: ${LIVE_LEAD_S:-6}
      TICK_MS: ${TICK_MS:-500}
      SEGMENT_RETAIN_S: ${SEGMENT_RETAIN_S:-30}
    volumes:
      - hls:/var/www/hls
      - ${MEDIA_DIR:-./media}:/media:ro
    ports: ["127.0.0.1:8085:8085"]

  # docker compose --profile monitoring up -d
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]

volumes:
  pgdata:
  hls:
