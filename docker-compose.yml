services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_USER: dev
      POSTGRES_DB: fast
    ports: ["5432:5432"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  origin:
    image: nginx:1.27
    volumes:
      - ./origin:/var/www
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8080:8080"]

  control-api:
    build: ./services/control-api
    environment:
      LOG_LEVEL: info
      API_KEY: dev-key
      POSTGRES_DSN: postgres://dev:dev@postgres:5432/fast?sslmode=disable
      REDIS_ADDR: redis:6379
    depends_on: [postgres, redis]
    ports: ["8081:8081"]

  epg:
    build: ./services/epg
    environment:
      LOG_LEVEL: info
      REDIS_ADDR: redis:6379
      API_KEY: dev-key
      EPG_TIMELINE_SOURCE: redis
      DEFAULT_WINDOW_HOURS: 24
      XMLTV_EXPORT_ENABLED: "true"
      XMLTV_EXPORT_EVERY: 15m
      XMLTV_OUTPUT: file:///var/epg/xmltv
      XMLTV_PUBLIC: "true"
    ports: ["8082:8082"]
    volumes:
      - ./origin/epg_out:/var/epg/xmltv

  ads:
    build: ./services/ads
    environment:
      LOG_LEVEL: info
      API_KEY: dev-key
      REDIS_ADDR: redis:6379
      ADS_PREFIX_ROOT: /var/www
      ADS_REGISTRY_FILE: /var/www/ads/_registry.json
      VAST_TIMEOUT_MS: 350
      VAST_DEADLINE_MS: 400
      SELECTION_ORDER: 30,15,10,5,2
    ports: ["8083:8083"]
    depends_on: [redis, origin]
    volumes:
      - ./origin:/var/www

  scheduler:
    build: ./services/scheduler
    environment:
      LOG_LEVEL: info
      POSTGRES_DSN: postgres://dev:dev@postgres:5432/fast?sslmode=disable
      REDIS_ADDR: redis:6379
      CHANNEL_ID: c1
    depends_on: [postgres, redis]
    ports: ["8084:8084"]

  playout:
    build: ./services/playout
    environment:
      LOG_LEVEL: info
      ORIGIN_ROOT: /var/www
      REDIS_ADDR: redis:6379
      POSTGRES_DSN: postgres://dev:dev@postgres:5432/fast?sslmode=disable
      ADS_URL: http://ads:8083/v1/ads/pod
      CHANNEL_ID: c1
    depends_on: [scheduler, ads, origin]
    ports: ["8085:8085"]
    volumes:
      - ./origin:/var/www
      - ./origin/spool:/spool

  packager:
    build: ./services/packager
    environment:
      LOG_LEVEL: info
      ORIGIN_ROOT: /var/www
      SPOOL_ROOT: /spool
      CHANNEL_ID: c1
      VARIANT_ID: v720
      VARIANT_BANDWIDTH: 3000000
      VARIANT_AVERAGE_BANDWIDTH: 2600000
      VARIANT_RESOLUTION: 1280x720
      VARIANT_FRAME_RATE: "25"
      VARIANT_CODECS: avc1.4d401f,mp4a.40.2
      PLAYLIST_WINDOW_MIN: 60
      PLAYLIST_WINDOW_MAX: 90
      TARGETDURATION_FLOOR: 2
    depends_on: [playout, origin]
    ports: ["8086:8086"]
    volumes:
      - ./origin:/var/www
      - ./origin/spool:/spool

  prometheus:
    image: prom/prometheus
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana
    ports: ["3000:3000"]


